name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Frontend)
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

  deploy:
    name: Build & Deploy
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || inputs.skip_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Frontend)
        run: npm ci --prefix frontend

      - name: Build frontend (GAS single-file)
        run: npm run build:gas --prefix frontend

      - name: Verify build output
        run: |
          SIZE=$(stat -f%z frontend/dist/index.html 2>/dev/null || stat -c%s frontend/dist/index.html)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "Build size: ${SIZE_MB} MB"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "ERROR: Build exceeds 30MB limit"
            exit 1
          fi

      - name: Copy to backend
        run: cp frontend/dist/index.html backend/index.html

      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASP_RC_JSON }}' > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.CLASP_SCRIPT_ID }}","rootDir":"./"}' > backend/.clasp.json

      - name: Push to Apps Script
        working-directory: backend
        run: npx @google/clasp push --force

      - name: Create Apps Script version
        id: version
        working-directory: backend
        run: |
          OUTPUT=$(npx @google/clasp version "Auto-Deploy ${{ github.sha }}" 2>&1)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oE '[0-9]+' | tail -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Redeploy production deployment
        working-directory: backend
        run: |
          npx @google/clasp redeploy "${{ secrets.CLASP_DEPLOYMENT_ID }}" \
            --versionNumber "${{ steps.version.outputs.version }}" \
            --description "Auto-Deploy ${{ github.sha }} - $(date -u +'%Y-%m-%d %H:%M')"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment:** \`${{ secrets.CLASP_DEPLOYMENT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
