name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Frontend)
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

  deploy:
    name: Build & Deploy
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || inputs.skip_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Frontend)
        run: npm ci --prefix frontend

      - name: Build frontend (GAS single-file)
        run: npm run build:gas --prefix frontend

      - name: Verify build output
        run: |
          SIZE=$(stat -f%z frontend/dist/index.html 2>/dev/null || stat -c%s frontend/dist/index.html)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "Build size: ${SIZE_MB} MB"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "ERROR: Build exceeds 30MB limit"
            exit 1
          fi

      - name: Copy to backend
        run: cp frontend/dist/index.html backend/index.html

      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASP_RC_JSON }}' > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.CLASP_SCRIPT_ID }}","rootDir":"./"}' > backend/.clasp.json

      - name: Push to Apps Script
        working-directory: backend
        run: npx @google/clasp push --force

      - name: Check Apps Script version limit
        working-directory: backend
        run: |
          SCRIPT_ID="${{ secrets.CLASP_SCRIPT_ID }}"
          RC="$HOME/.clasprc.json"
          ACCESS_TOKEN=$(jq -r '.tokens.default.access_token // .tokens.access_token // .access_token' "$RC")
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "::error::no access_token found in clasp credentials"
            exit 1
          fi
          PAGE=""
          TMP_FILE=$(mktemp)
          while :; do
            if [ -n "$PAGE" ]; then
              LIST=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions?pageToken=$PAGE")
            else
              LIST=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
            fi
            echo "$LIST" | jq -r '.versions[]?.versionNumber' >> "$TMP_FILE"
            PAGE=$(echo "$LIST" | jq -r '.nextPageToken // empty')
            [ -z "$PAGE" ] && break
          done
          TOTAL=$(sort -n "$TMP_FILE" | wc -l)
          rm -f "$TMP_FILE"
          echo "Total versions: $TOTAL"
          if [ "$TOTAL" -ge 200 ]; then
            echo "::error::Apps Script version limit reached ($TOTAL/200). Versions can only be deleted from the Project History UI (script.google.com -> Project History -> Bulk delete versions) - the REST API has no delete method. Free up versions manually, then re-run this workflow."
            exit 1
          fi
          if [ "$TOTAL" -ge 190 ]; then
            echo "::warning::Approaching Apps Script version limit ($TOTAL/200). Plan a manual cleanup via Project History -> Bulk delete versions soon."
          fi

      - name: Create Apps Script version
        id: version
        working-directory: backend
        run: |
          set +e
          OUTPUT=$(npx @google/clasp version "Auto-Deploy ${{ github.sha }}" 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            echo "::error::clasp version failed with exit code $EXIT"
            exit $EXIT
          fi
          VERSION=$(echo "$OUTPUT" | grep -oE '[0-9]+' | tail -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Redeploy production deployment
        working-directory: backend
        run: |
          npx @google/clasp redeploy "${{ secrets.CLASP_DEPLOYMENT_ID }}" \
            --versionNumber "${{ steps.version.outputs.version }}" \
            --description "Auto-Deploy ${{ github.sha }} - $(date -u +'%Y-%m-%d %H:%M')"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment:** \`${{ secrets.CLASP_DEPLOYMENT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
